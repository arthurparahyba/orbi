# Gera o instalador do Orbi para Windows (.exe), sem precisar de Rust na sua máquina.
# Rode em Actions → "App Windows" → Run workflow; o .exe sai em Artifacts.
# Uma tag v* (ex.: v0.2.0) também gera e anexa o .exe a uma release.
name: App Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # o Node do build vai dentro do app (precisa ≥ 22.13)
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dependências
        run: npm ci

      # O Orbi ainda não foi testado no Windows: os testes mostram o que quebra lá,
      # sem impedir o instalador.
      - name: Testes (informativo)
        run: npm test
        continue-on-error: true

      - name: Instalador (.exe)
        run: npm run build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Orbi-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
